<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Портал ГМЗ-1</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8962e'/%3E%3Cpath d='M9 22V10h6a4 4 0 0 1 0 8h-6' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Применяем тему до отрисовки, чтобы не было мигания
    try {
      var t = localStorage.getItem("portal-theme");
      if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
      document.documentElement.setAttribute("data-theme", t || "light");
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">Г</span>
        <span class="brand-text">
          <span class="brand-title" id="portal-title">Портал ГМЗ-1</span>
          <span class="brand-sub" id="portal-subtitle"></span>
        </span>
      </a>
      <div class="topbar-right">
        <div class="clock" aria-live="off">
          <span class="clock-time" id="clock-time">--:--</span>
          <span class="clock-date" id="clock-date"></span>
        </div>
        <button class="icon-btn" id="theme-toggle" type="button" title="Сменить тему" aria-label="Сменить тему"></button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1 class="hero-greeting" id="greeting">Добро пожаловать</h1>
      <div class="search">
        <span class="search-icon" id="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Поиск приложения…" autocomplete="off" aria-label="Поиск приложения">
        <kbd class="search-kbd" title="Нажмите / для поиска">/</kbd>
      </div>
      <nav class="chips" id="chips" aria-label="Разделы"></nav>
    </section>

    <div class="layout">
      <div class="content" id="content"></div>
      <aside class="sidebar" id="sidebar"></aside>
    </div>
  </main>

  <footer class="footer">
    <span id="footer-text"></span>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
